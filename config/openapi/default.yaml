components:
    schemas:
        BadRequestErrorView:
            properties:
                type:
                    type: string
                    default: 'https://tools.ietf.org/html/rfc2616#section-10'
                title:
                    type: string
                    default: 'Bad Request'
                status:
                    type: integer
                    default: 400
                detail:
                    type: string
            type: object
            readOnly: true
        UnauthorizedErrorView:
            properties:
                type:
                    type: string
                    default: 'https://tools.ietf.org/html/rfc2616#section-10'
                title:
                    type: string
                    default: 'Unauthorized'
                status:
                    type: integer
                    default: 401
                detail:
                    type: string
            type: object
            readOnly: true
        ForbiddenErrorView:
            properties:
                type:
                    type: string
                    default: 'https://tools.ietf.org/html/rfc2616#section-10'
                title:
                    type: string
                    default: 'Forbidden'
                status:
                    type: integer
                    default: 403
                detail:
                    type: string
            type: object
            readOnly: true
        NotFoundErrorView:
            properties:
                type:
                    type: string
                    default: 'https://tools.ietf.org/html/rfc2616#section-10'
                title:
                    type: string
                    default: 'Not Found'
                status:
                    type: integer
                    default: 404
                detail:
                    type: string
            type: object
            readOnly: true
        ValidationErrorView:
            properties:
                type:
                    type: string
                    default: 'https://symfony.com/errors/validation'
                title:
                    type: string
                    default: 'Validation Failed'
                status:
                    type: integer
                    default: 422
                detail:
                    type: string
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/ValidationViolationErrorView'
            type: object
            readOnly: true
        ValidationViolationErrorView:
            properties:
                propertyPath:
                    type: string
                title:
                    type: string
                template:
                    type: string
                parameters:
                    type: object
                    additionalProperties:
                        type: string
                type:
                    type: string
                    example: 'urn:uuid:9ff3fdc4-b214-49db-8718-39c315e33d45'
            type: object
            readOnly: true
    responses:
        '400':
            description: 'Bad request'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BadRequestErrorView'
        '401':
            description: 'Unauthorized'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UnauthorizedErrorView'
        '403':
            description: 'Forbidden'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ForbiddenErrorView'
        '404':
            description: 'Not found'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotFoundErrorView'
        '422':
            description: 'Validation error'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidationErrorView'
